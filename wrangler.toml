# INMA Workflow — configuration Cloudflare (offre gratuite).
name = "inma-workflow"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
# La base est créée automatiquement au premier déploiement (aucun identifiant à saisir).
binding = "DB"
database_name = "inma-workflow"

[vars]
APP_NAME = "INMA Workflow"
# Laisser vide : l'adresse est détectée automatiquement (https://inma-workflow.<compte>.workers.dev)
APP_URL = ""
# Accès administrateur complet (séparer par des virgules)
ADMIN_EMAILS = ""
# Microsoft Entra ID (gratuit avec Microsoft 365)
AZURE_TENANT_ID = ""
AZURE_CLIENT_ID = ""
# Envoi des e-mails via Microsoft 365 dès que AZURE_CLIENT_SECRET et MAIL_FROM sont renseignés
MAIL_MODE = "graph"
MAIL_FROM = ""
# true = charge les 10 dossiers de démonstration au premier démarrage
SEED_DEMO = "true"
SESSION_DAYS = "14"
DEV_MODE = "false"
# Secrets (jamais ici) : ADMIN_PASSWORD et AZURE_CLIENT_SECRET, saisis lors du déploiement ou dans Cloudflare › Paramètres › Variables et secrets
