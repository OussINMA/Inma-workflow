<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INMA Workflow</title>
<meta name="theme-color" content="#212121">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="/vendor/msal-browser.min.js"></script>
<script src="/inma-standalone.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy sidebar rail (brand) + working canvas; drawer for dossier detail; settings as tabbed console */
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --surface-2:#E9E9E9; --ink:#212121; --muted:#666A6E; --line:#DDDDDD;
  --brand:var(--brand-cfg,#212121); --accent:var(--accent-cfg,#E22529);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:var(--brand); --rail-ink:#E9E9E9; --rail-muted:#9A9FA5; --rail-active:rgba(255,255,255,.08);
  --ok:#2F8A5B; --warn:#B7791F; --bad:#B3191D; --info:#2F6FB0;
  --ok-bg:#E5F3EB; --warn-bg:#FBF0DD; --bad-bg:#FBE6E4; --info-bg:#E3EEF9;
  --shadow:0 1px 2px rgba(33,33,33,.06),0 6px 24px rgba(33,33,33,.10);
  --f-ui:var(--font-cfg,"Montserrat"),"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px; --pad:var(--density,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191C; --surface:#202326; --surface-2:#2A3139; --ink:#EDEDED; --muted:#A3A8AE; --line:#353C45;
  --brand:color-mix(in oklab,var(--brand-cfg,#212121) 85%,black); --accent:color-mix(in oklab,var(--accent-cfg,#E22529) 88%,white);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:color-mix(in oklab,var(--brand-cfg,#212121) 80%,black); --rail-ink:#E9E9E9; --rail-muted:#8E949B; --rail-active:rgba(255,255,255,.07);
  --ok:#5CC08B; --warn:#E3A84B; --bad:#FF6B6E; --info:#6FA8E4;
  --ok-bg:#16301F; --warn-bg:#33280F; --bad-bg:#3D1718; --info-bg:#14273A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191C; --surface:#202326; --surface-2:#2A3139; --ink:#EDEDED; --muted:#A3A8AE; --line:#353C45;
  --brand:color-mix(in oklab,var(--brand-cfg,#212121) 85%,black); --accent:color-mix(in oklab,var(--accent-cfg,#E22529) 88%,white);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:color-mix(in oklab,var(--brand-cfg,#212121) 80%,black); --rail-ink:#E9E9E9; --rail-muted:#8E949B; --rail-active:rgba(255,255,255,.07);
  --ok:#5CC08B; --warn:#E3A84B; --bad:#FF6B6E; --info:#6FA8E4;
  --ok-bg:#16301F; --warn-bg:#33280F; --bad-bg:#3D1718; --info-bg:#14273A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:18px;padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brandmark{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brandmark img{max-height:34px;max-width:150px}
.wordmark{font-weight:700;font-size:22px;letter-spacing:.18em;color:#fff}
.wordmark small{display:block;font-size:10px;letter-spacing:.22em;font-weight:500;color:var(--accent-cfg,#E22529);margin-top:1px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;border:0;background:none;color:var(--rail-ink);cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--rail-active)}
.nav.on{background:var(--rail-active);box-shadow:inset 3px 0 0 var(--accent-cfg,#E22529);color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-muted)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--rail-muted)}
.railfoot b{color:#fff;font-weight:600}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:700}
.crumb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.content{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in oklab,var(--warn) 40%,transparent)}
.banner.info{background:var(--info-bg);border-color:color-mix(in oklab,var(--info) 35%,transparent)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:calc(7px*var(--pad)) 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:color-mix(in oklab,var(--ink) 30%,var(--line))}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:calc(7px*var(--pad)) 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f>span{letter-spacing:.02em}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:14px;font-weight:700}
.panel>header>svg{width:18px;height:18px;flex:none;color:var(--accent)}
.panel>.body{padding:14px 16px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;border:2px solid var(--surface)}
.avs{display:inline-flex}.avs .avatar+.avatar{margin-left:-7px}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.prio i{width:3px;height:12px;border-radius:2px;display:inline-block}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{display:block;height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--brand);border-radius:3px}
:root[data-theme="dark"] .bar .fill{background:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .fill{background:var(--accent)}}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tables */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:calc(9px*var(--pad)) 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto;max-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border-radius:var(--r);display:flex;flex-direction:column;max-height:75vh}
.col>header{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.col>header .n{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.col .cards{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.card .ref{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.card .ttl{font-weight:600;font-size:13px;line-height:1.3}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.lock{font-size:10.5px;color:var(--warn);font-weight:700;letter-spacing:.04em}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cal .d{background:var(--surface);min-height:96px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:var(--surface-2);opacity:.6}
.cal .d .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cal .d.today .n{color:var(--on-primary);background:var(--primary);border-radius:4px;padding:0 4px;align-self:flex-start}
.cal .ev{font-size:11px;padding:2px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--accent);background:var(--surface-2)}
/* timeline */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tl-inner{min-width:900px;position:relative}
.tl-head{display:grid;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tl-row{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line);min-height:38px;align-items:center}
.tl-row .nm{padding:6px 10px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line);cursor:pointer}
.tl-track{position:relative;height:38px}
.tl-bar{position:absolute;top:9px;height:20px;border-radius:4px;background:var(--brand);color:#fff;font-size:11px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(6,14,24,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:2}
.drawer .dbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modalwrap{position:fixed;inset:0;background:rgba(6,14,24,.5);z-index:60;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal>header h2{font-size:16px}
.modal .mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 110px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;cursor:pointer;padding-right:6px}
.step .bar2{height:5px;border-radius:3px;background:var(--line)}
.step.done .bar2{background:var(--ok)}
.step.cur .bar2{background:var(--accent)}
.step.cur{font-weight:700}
.step .nm{color:var(--muted)}
.step.cur .nm,.step.done .nm{color:var(--ink)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow .t2{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-family:var(--f-mono);font-size:11.5px}
.due.late{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.cb{width:17px;height:17px;accent-color:var(--ok)}
/* settings */
.settings{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}
.stabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
.stab{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.stab.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.permgrid th{writing-mode:initial}
.permgrid td,.permgrid th{text-align:center}
.permgrid td:first-child,.permgrid th:first-child{text-align:left}
.stagecard{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--surface)}
.stagecard .ix{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:7px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;z-index:90;box-shadow:var(--shadow)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:15px}
.inbox{position:absolute;right:0;top:44px;width:min(380px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:20;max-height:70vh;overflow:auto;padding:6px 14px}
.bell{position:relative}
.bell .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-family:var(--f-mono)}
.folder{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.folder .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder svg{width:16px;height:16px;color:var(--accent);flex:none}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--f-mono);font-size:11.5px;overflow-x:auto;white-space:pre;margin:0;max-height:240px}
.comment{display:flex;gap:10px;padding:8px 0}
.comment .bubble{background:var(--surface-2);border-radius:8px;padding:8px 10px;flex:1;min-width:0;font-size:13px}
.comment .bubble .who{font-size:12px;font-weight:700}
.comment .bubble .when{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.mention{color:var(--info);font-weight:600}
.mobilenav{display:none}
.dl-date{width:46px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;padding:3px 0;line-height:1.1;background:var(--surface)}
.dl-date b{font-family:var(--f-mono);font-size:17px;font-weight:500}
.dl-date span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dl-date.late{border-color:var(--bad);color:var(--bad)}
.dl-date.late span{color:var(--bad)}
.dl-row .t2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;white-space:normal}

/* ---------- automations ---------- */
function membersWithRole(rid) { return S.cfg.members.filter(m => m.roleId === rid).map(m => m.id); }
async function runAutomations(type, ctx) {
  for (const a of S.cfg.automations.filter(a => a.enabled && a.trigger.type === type)) {
    const v = a.trigger.value || "";
    let match = false;
    if (type === "dossier_created") match = !v || v === ctx.dossier.workflowId;
    if (type === "stage_enter") { const [wf, sn] = v.split(":"); const s = stageOf(ctx.dossier); match = (wf === "*" || wf === ctx.dossier.workflowId) && !!s && (s.id === sn || s.name.toLowerCase().includes((sn || "").toLowerCase())); }
    if (type === "task_created") match = !v || v === ctx.task.priority;
    if (type === "task_status") match = v === ctx.task.status;
    if (!match) continue;
    const act = a.action, target = ctx.task || ctx.dossier, label = ctx.task ? `la tâche « ${ctx.task.title} »` : `le dossier ${ctx.dossier.code}`;
    if (act.type === "notify_role") await log(`Automatisation « ${a.name} » : ${label}`, { dossierId: ctx.dossier?.id || ctx.task?.dossierId, taskId: ctx.task?.id, notify: membersWithRole(act.value) });
    if (act.type === "notify_member") await log(`Automatisation « ${a.name} » : ${label}`, { dossierId: ctx.dossier?.id || ctx.task?.dossierId, taskId: ctx.task?.id, notify: [act.value] });
    if (act.type === "set_priority") { target.priority = act.value; await putDoc(ctx.task ? "tasks" : "dossiers", target); }
    if (act.type === "add_tag") { target.tags = [...new Set([...(target.tags || []), act.value])]; await putDoc(ctx.task ? "tasks" : "dossiers", target); }
    if (act.type === "assign_role" && ctx.task) { const ids = membersWithRole(act.value); if (ids.length) { ctx.task.assignees = [...new Set([...(ctx.task.assignees || []), ids[0]])]; await putDoc("tasks", ctx.task); } }
    if (act.type === "create_task") { const did = ctx.dossier?.id || ctx.task?.dossierId; await createTask({ title: act.value || "Tâche automatique", dossierId: did, assignees: ctx.dossier ? [ctx.dossier.ownerId].filter(Boolean) : [] }, true); }
  }
}

  const prev = stageOf(d);
  d.stageId = stageId; d.history = [...(d.history || []), { at: new Date().toISOString(), by: me()?.id || null, from: prev?.name || null, to: s.name, approved: !!viaApproval }];

async function moveStage(d, stageId) {
  const w = wfById(d.workflowId); const cur = stageOf(d); const ci = w.stages.indexOf(cur), ni = w.stages.findIndex(s => s.id === stageId);
  if (ni === ci) return;

  if (ni > ci && cur && cur.approval) {

      await putDoc("dossiers", d);
      await log(`Validation demandée pour ${d.code} : « ${cur.name} » → « ${w.stages[ni].name} »`, { dossierId: d.id, notify: S.cfg.members.filter(m => role(m.roleId)?.perms.stage_approve).map(m => m.id) });

async function completeTask(t, done) {

    if (blockers.length) { toast(`Bloquée par : ${blockers.map(b => b.title).join(", ")}`); render(); return; }
  }
  const doneId = S.cfg.statuses.find(s => s.done)?.id, todoId = S.cfg.statuses.find(s => !s.done)?.id;

    await createTask({ ...clone(t), id: uid("t"), status: todoId, due: nd, completedAt: null, comments: [], checklist: (t.checklist || []).map(c => ({ ...c, done: false })) }, true);

}

function filterDossiers() {

}

function cell(d, c) {

function timelineView(ds) {
  const items = ds.filter(d => d.startDate || d.dueDate);

  const t0 = new Date(); t0.setDate(1); t0.setMonth(t0.getMonth() - 2); const months = 9;
  const start = t0.toISOString().slice(0, 10); const endD = new Date(t0); endD.setMonth(endD.getMonth() + months); const end = endD.toISOString().slice(0, 10);
  const span = daysBetween(start, end); const pct = iso => Math.max(0, Math.min(100, daysBetween(start, iso) / span * 100));
  const heads = [...Array(months)].map((_, i) => { const d = new Date(t0); d.setMonth(d.getMonth() + i); return d.toLocaleDateString("fr-FR", { month: "short", year: "2-digit" }); });

}

function vCalendar() {

  const evs = [...visTasks().filter(t => t.due).map(t => ({ d: t.due, label: t.title, color: statusById(t.status).color, task: t.id, done: isDone(t) })),

    <label class="f"><span>Description</span><textarea id="tk-desc" ${dis}>${h(t.description || "")}</textarea></label>
    <div><div class="eyebrow" style="margin-bottom:6px">Checklist</div><div id="tk-check">${(t.checklist || []).map((c, i) => `<label class="chk" style="display:flex;margin:3px 0"><input type="checkbox" class="cb" data-ci="${i}" ${c.done ? "checked" : ""} ${dis}>${h(c.text)}</label>`).join("")}</div>${ed ? `<div class="row" style="margin-top:6px"><input type="text" id="tk-newcheck" placeholder="Ajouter un élément…" style="max-width:320px"><button class="btn sm" id="tk-addcheck">Ajouter</button></div>` : ""}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">Documents OneDrive</div><div id="tk-docs">${docList(t.docs, null)}</div>${ed ? `<div class="row" style="margin-top:6px"><input type="text" id="tk-docname" placeholder="Nom" style="max-width:200px"><input type="url" id="tk-docurl" placeholder="Lien OneDrive" style="max-width:260px"><button class="btn sm" id="tk-adddoc">Lier</button></div>` : ""}</div>
    ${!isNew ? `<div><div class="eyebrow" style="margin-bottom:6px">Commentaires</div>${(t.comments || []).map(c => `<div class="comment">${av(c.by)}<div class="bubble"><span class="who">${h(mname(c.by))}<span class="when">${new Date(c.at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}</span></span><div>${h(c.text).replace(/@([\wÀ-ÿ-]+)/g, '<span class="mention">@$1</span>')}</div></div></div>`).join("") || '<p class="muted" style="margin:0">Aucun commentaire.</p>'}<div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="text" id="tk-comment" placeholder="Écrire un commentaire… (@Prénom pour mentionner)"><button class="btn sm" id="tk-send">Envoyer</button></div></div>` : ""}`;
  modal(isNew ? "Nouvelle tâche" : "Tâche", inner, `${!isNew && ed ? `<button class="btn danger" id="tk-del">Supprimer</button><span class="spacer"></span>` : ""}<button class="btn" data-mclose="1">Fermer</button>${ed ? `<button class="btn pri" id="tk-save">${isNew ? "Créer la tâche" : "Enregistrer"}</button>` : ""}`, L => {
    const collect = () => { t.title = $("#tk-title", L).value.trim(); t.dossierId = $("#tk-dossier", L).value || null; t.status = $("#tk-status", L).value; t.priority = $("#tk-prio", L).value; t.due = $("#tk-due", L).value; t.recurring = $("#tk-rec", L).value; t.dependsOn = $("#tk-dep", L).value ? [$("#tk-dep", L).value] : []; t.assignees = $$("[data-tka]", L).filter(x => x.checked).map(x => x.dataset.tka); t.description = $("#tk-desc", L).value; t.checklist = (t.checklist || []).map((c, i) => ({ ...c, done: $(`[data-ci="${i}"]`, L)?.checked || false })); t.custom = { ...(t.custom || {}) }; $$("[data-cf]", L).forEach(x => t.custom[x.dataset.cf] = x.value); };
    $("#tk-addcheck", L) && ($("#tk-addcheck", L).onclick = () => { const v = $("#tk-newcheck", L).value.trim(); if (!v) return; collect(); t.checklist.push({ text: v, done: false }); $("#tk-check", L).innerHTML = t.checklist.map((c, i) => `<label class="chk" style="display:flex;margin:3px 0"><input type="checkbox" class="cb" data-ci="${i}" ${c.done ? "checked" : ""}>${h(c.text)}</label>`).join(""); $("#tk-newcheck", L).value = ""; });
    $("#tk-adddoc", L) && ($("#tk-adddoc", L).onclick = () => { const n = $("#tk-docname", L).value.trim(), u = $("#tk-docurl", L).value.trim(); if (!isURL(u)) { toast("Collez un lien https:// valide."); return; } t.docs = [...(t.docs || []), { name: n || u.split("/").pop().split("?")[0] || "Document", url: u, by: me()?.id || null, at: todayISO() }]; $("#tk-docs", L).innerHTML = docList(t.docs, null); $("#tk-docname", L).value = $("#tk-docurl", L).value = ""; });
    $("#tk-save", L) && ($("#tk-save", L).onclick = async () => {
      const prevStatus = isNew ? null : S.tasks.find(x => x.id === t.id)?.status; const prevAss = isNew ? [] : (S.tasks.find(x => x.id === t.id)?.assignees || []);
      collect(); if (!t.title) { toast("Indiquez un titre."); return; }
      if (statusById(t.status)?.done && (t.dependsOn || []).some(id => { const x = S.tasks.find(y => y.id === id); return x && !isDone(x); })) { toast("Cette tâche dépend d'une tâche non terminée."); return; }
      L.remove();
      if (isNew) { const nt = await createTask(t); await log(`Tâche créée : « ${nt.title} »`, { taskId: nt.id, dossierId: nt.dossierId }); }
      else { await putDoc("tasks", t); const added = t.assignees.filter(x => !prevAss.includes(x)); if (added.length && S.cfg.notify.onAssign) await log(`Tâche assignée : « ${t.title} »`, { taskId: t.id, dossierId: t.dossierId, notify: added }); if (prevStatus !== t.status) { if (statusById(t.status).done) { t.status = prevStatus; await completeTask(t, true); } else await runAutomations("task_status", { task: t }); } }
      render(); renderDrawer();
    });
    $("#tk-del", L) && ($("#tk-del", L).onclick = () => { L.remove(); confirmBox(`Supprimer la tâche « ${t.title} » ?`, "Supprimer", async () => { await delDoc("tasks", t.id); await log(`Tâche supprimée : « ${t.title} »`, { dossierId: t.dossierId }); render(); renderDrawer(); }); });
    $("#tk-send", L) && ($("#tk-send", L).onclick = async () => {
      const v = $("#tk-comment", L).value.trim(); if (!v) return;
      const cur = S.tasks.find(x => x.id === t.id); cur.comments = [...(cur.comments || []), { by: me()?.id || null, at: new Date().toISOString(), text: v }];
      await putDoc("tasks", cur);
      const ment = S.cfg.members.filter(m => new RegExp("@" + m.name.split(" ")[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(v)).map(m => m.id);
      await log(`Commentaire sur « ${cur.title} » : ${v.slice(0, 80)}`, { taskId: cur.id, dossierId: cur.dossierId, notify: S.cfg.notify.onMention ? ment : [] });
      L.remove(); taskModal(cur);
    });
  });
}

/* ---------- funds view ---------- */
const FIELD_TYPES = [["text","Texte"],["number","Nombre"],["currency","Montant"],["date","Date"],["select","Liste déroulante"],["url","Lien"]];
const fstatus = id => (S.cfg.fundStatuses || []).find(s => s.id === id) || { label: "—", color: "#7B8794" };
function fundStats(f) { const ds = S.dossiers.filter(d => !d.archived && d.vehicle === f.name && canSeeDossier(d)); return { ds, amount: ds.reduce((s, d) => s + (+d.amount || 0), 0), nodes: countNodes(f.tree), linked: countNodes(f.tree, true) }; }
function msBar(f) { const ms = f.milestones || []; if (!ms.length) return ""; const d = ms.filter(x => x.done).length; return `<span class="row" style="flex-wrap:nowrap;gap:8px;width:100%"><span class="msbar"><span style="width:${d / ms.length * 100}%"></span></span><span class="muted num" style="font-size:11.5px;white-space:nowrap">${d}/${ms.length} jalons</span></span>`; }
function fieldVal(f, x, plain) {
  const v = f.fields?.[x.id]; if (v === "" || v == null) return '<span class="muted">—</span>';
  if (x.type === "currency") return money(v);
  if (x.type === "url") return (!plain && isURL(v)) ? `<a href="${h(v)}" target="_blank" rel="noopener">${h(linkKind(v))}</a>` : h(linkKind(v) || v);
  if (x.type === "date") return h(fdate(v));
  return h(v);
}
function fundFieldInput(x, v) {
  if (x.type === "select") return `<select data-ff="${x.id}"><option value="">—</option>${(x.options || []).map(o => `<option ${v === o ? "selected" : ""}>${h(o)}</option>`).join("")}</select>`;
  const t = { number: "number", currency: "number", date: "date", url: "url" }[x.type] || "text";
  return `<input type="${t}" data-ff="${x.id}" value="${h(v ?? "")}">`;
}

function vFunds() {

  const sel = fundById(S.ui.fund) || funds[0]; const root = S.cfg.fundRoot || {};
  const tb = `<div class="toolbar"><div class="seg">${[["org","Organigramme"],["list","Tableau"]].map(x => `<button class="${fv.mode === x[0] ? "on" : ""}" data-fv="${x[0]}">${x[1]}</button>`).join("")}</div>
    <label class="chk"><input type="checkbox" id="fv-dossiers" ${fv.showDossiers ? "checked" : ""}>Afficher les dossiers de travail dans l'architecture</label><span class="spacer"></span>
    ${can("funds") ? `<button class="btn" data-stab-go="funds">${ic("gear")}Personnaliser</button><button class="btn pri" data-act2="fund-add">${ic("plus")}Nouveau fonds</button>` : ""}</div>`;

    over = `<div class="panel tablewrap"><table class="t"><thead><tr><th>Fonds</th><th>Statut</th><th>Type</th><th>Création</th>${ffs.map(x => `<th>${h(x.label)}</th>`).join("")}<th class="r">Dossiers</th><th class="r">Montants</th><th>Dossier racine</th></tr></thead><tbody>

  } else {
    const ffs = (S.cfg.fundFields || []).slice(0, 2);
    over = `<div class="panel"><div class="body"><div class="orgwrap"><div class="orginner">
      <div class="orgroot"><span class="eyebrow" style="color:var(--rail-muted)">${h(root.subtitle || "Société de gestion")}</span><b>${h(root.name || "INMA Capital")}</b>${isURL(root.url) ? `<a href="${h(root.url)}" target="_blank" rel="noopener" class="orglink">${ic("ext")}${h(linkKind(root.url))}</a>` : ""}</div>
      <div class="orgstem"></div>
      <div class="orgrow">${funds.map(f => { const st = fundStats(f), s = fstatus(f.status); return `<button class="orgfund ${sel && sel.id === f.id ? "on" : ""}" data-fund="${f.id}" style="--fc:${h(f.color || "#212121")}">
        <span class="row" style="gap:7px;flex-wrap:nowrap"><span class="fdot"></span><b>${h(f.name)}</b></span>
        <span class="row" style="gap:6px">${chip(s.label, s.color)}<span class="muted" style="font-size:12px">${h(f.type || "Type à définir")}${f.year ? " · " + h(f.year) : ""}</span></span>

function treeHTML(f, nodes, ef, el, showD) {
  return `<ul class="tree">${(nodes || []).map(n => {
    const shared = S.cfg.members.filter(m => m.external && (m.grants || []).some(g => g.kind === "node" && g.id === n.id)).length;
    const autoDs = n.auto === "dossiers" && showD ? S.dossiers.filter(d => !d.archived && d.vehicle === f.name && canSeeDossier(d)) : [];
    return `<li><div class="tnode" data-node="${f.id}|${n.id}">${ic("folder")}<button class="nm linkish" data-nact="edit" title="${h(n.note || "Ouvrir la fiche du dossier")}">${h(n.name)}</button>
      ${n.auto === "dossiers" ? '<span class="tag">dossiers de travail</span>' : ""}
      ${isURL(n.url) ? `<span class="lk">${h(linkKind(n.url))}</span>` : (el ? '<span class="lk off">non lié</span>' : "")}
      ${shared ? `<span class="tag" title="Partagé avec ${shared} externe(s)">${ic("team")} ${shared}</span>` : ""}

  }).join("")}</ul>`;
}

        ${(f.tree || []).length ? treeHTML(f, f.tree, ef, el, fv.showDossiers) : '<p class="muted">Architecture vide. Ajoutez un premier dossier.</p>'}
        <p class="muted" style="font-size:11.5px;margin:10px 0 0">${ef ? "Survolez un dossier pour en ajouter un sous-dossier, le déplacer, le lier à OneDrive / SharePoint ou le partager avec un externe. " : ""}${ext ? `${ext} externe(s) ont accès à des dossiers de ce fonds.` : ""}</p>
      </div></div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">

    if (g.kind === "dossier") { const d = dossierById(g.id); if (!d) continue; L.push(`• ${d.code} · ${d.name} (${lvlLabel(g.level).toLowerCase()})${g.until ? ` — jusqu'au ${fdate(g.until)}` : ""}`); if (isURL(d.oneDriveUrl)) L.push(`  Documents : ${d.oneDriveUrl}`); }

const DL_FREQ = { monthly: ["Mensuelle", 1], quarterly: ["Trimestrielle", 3], semiannual: ["Semestrielle", 6], annual: ["Annuelle", 12] };

function occurrences(o, from, to) {

      if (!/^\d{2}-\d{2}$/.test(md)) continue; const d = `${y}-${md}`; if (d >= from && d <= to) out.push({ key: d, due: d });
    }

      out.push({ key, due });

  if (t.id && t.id.startsWith("tf-")) { S.ui.tf = S.ui.tf || {}; const k = t.id.slice(3); if (k === "done") S.ui.tf.showDone = t.checked; else S.ui.tf[k] = t.value; saveUI(); render(); return; }
  if (ds.done) { const tk = S.tasks.find(x => x.id === ds.done); await completeTask(tk, t.checked); renderDrawer(); return; }
  if (ds.cfg) { let v = t.type === "number" ? (t.value === "" ? "" : +t.value) : t.value; setPath(S.cfg, ds.cfg, v); saveCfg(); if (ds.rerender || /\.(type|roleId)$/.test(ds.cfg) || ds.cfg.startsWith("general.")) render(); return; }
  if (ds.cfgbool) { setPath(S.cfg, ds.cfgbool, t.checked); saveCfg(); return; }
  if (ds.cfglines) { setPath(S.cfg, ds.cfglines, t.value.split("\n").map(x => x.trim()).filter(Boolean)); saveCfg(); return; }
  if (ds.mod) { S.cfg.general.modules[ds.mod] = t.checked; saveCfg(); render(); return; }
  if (ds.perm) { const [rid, k] = ds.perm.split("|"); role(rid).perms[k] = t.checked; saveCfg(); return; }
  if (ds.roleName) { role(ds.roleName).name = t.value.trim() || "Rôle"; saveCfg(); return; }
  if (ds.roleColor) { role(ds.roleColor).color = t.value; saveCfg(); return; }
  if (ds.fwf) { const [i, wid] = ds.fwf.split("|"); const f = S.cfg.customFields[+i]; f.workflows = t.checked ? [...new Set([...(f.workflows || []), wid])] : (f.workflows || []).filter(x => x !== wid); saveCfg(); return; }
  if (ds.odwf) { S.cfg.onedrive.perWorkflowRoot = S.cfg.onedrive.perWorkflowRoot || {}; S.cfg.onedrive.perWorkflowRoot[ds.odwf] = t.value.trim(); saveCfg(); return; }
  if (t.id === "logo-file" && t.files[0]) { const f = t.files[0]; const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const sc = Math.min(1, 320 / img.width, 90 / img.height); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc) || 160; c.height = Math.round(img.height * sc) || 40; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); S.cfg.general.logo = c.toDataURL("image/png"); saveCfg("Logo mis à jour"); render(); }; img.onerror = () => toast("Image illisible. Essayez un PNG."); img.src = r.result; }; r.readAsDataURL(f); return; }
  if (t.id === "import-file" && t.files[0]) { const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (!j.cfg || !Array.isArray(j.dossiers)) throw 0; confirmBox(`Importer ${j.dossiers.length} dossiers et ${(j.tasks || []).length} tâches ? Les paramètres seront remplacés ; les éléments existants de même identifiant aussi.`, "Importer", async () => { S.cfg = { ...DEFAULT_CFG(), ...j.cfg }; saveCfg("Paramètres importés"); for (const d of j.dossiers) await putDoc("dossiers", d); for (const x of j.tasks || []) await putDoc("tasks", x); for (const x of j.deadlines || []) await putDoc("deadlines", x); for (const x of j.projects || []) await putDoc("projects", x); toast("Import terminé"); render(); }); } catch { toast("Fichier invalide : utilisez une sauvegarde exportée depuis l'outil."); } }; r.readAsText(t.files[0]); }
});
document.addEventListener("input", e => { if (e.target.id === "f-q" || e.target.id === "tf-q") { clearTimeout(S.qT); const id = e.target.id; S.qT = setTimeout(() => { if (id === "f-q") S.ui.filters.q = e.target.value; else { S.ui.tf = S.ui.tf || {}; S.ui.tf.q = e.target.value; } saveUI(); render(); const el = $("#" + id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 250); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#modal")) $("#modal").remove(); else if (S.openDossier) { S.openDossier = null; renderDrawer(); } } });
/* drag & drop */
let dragId = null, dragKind = null;
document.addEventListener("dragstart", e => { const c = e.target.closest("[data-drag],[data-tdrag]"); if (!c) return; dragId = c.dataset.drag || c.dataset.tdrag; dragKind = c.dataset.drag ? "d" : "t"; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch {} });
document.addEventListener("dragover", e => { const col = e.target.closest(dragKind === "d" ? "[data-col]" : "[data-tcol]"); if (!col) return; e.preventDefault(); $$(".col.drop").forEach(x => x !== col && x.classList.remove("drop")); col.classList.add("drop"); });
document.addEventListener("dragleave", e => { const col = e.target.closest(".col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop"); });
document.addEventListener("drop", async e => { const col = e.target.closest("[data-col],[data-tcol]"); $$(".col.drop").forEach(x => x.classList.remove("drop")); if (!col || !dragId) return; e.preventDefault();
  if (dragKind === "d" && col.dataset.col) { const [wid, sid] = col.dataset.col.split("|"); const d = dossierById(dragId); if (d && d.workflowId === wid) await moveStage(d, sid); else toast("Un dossier ne peut pas changer de workflow."); }
  if (dragKind === "t" && col.dataset.tcol) { const t = S.tasks.find(x => x.id === dragId); if (t && canEditTask(t)) { if (statusById(col.dataset.tcol).done) await completeTask(t, true); else { t.status = col.dataset.tcol; await putDoc("tasks", t); await runAutomations("task_status", { task: t }); render(); } } else toast("Votre rôle ne permet pas de modifier cette tâche."); }
  dragId = null; });

/* ---------- import / export / samples ---------- */
async function saveFile(filename, data) {
  if (!S.downloads) { toast("Téléchargement indisponible dans cette vue."); return; }
  try { await S.downloads.save({ filename, data }); } catch (e) { if (e?.code !== "declined") toast("Téléchargement impossible : " + (e?.message || "erreur")); }
}
function exportJSON() { saveFile(`inma-workflow-${todayISO()}.json`, JSON.stringify({ exportedAt: new Date().toISOString(), cfg: S.cfg, dossiers: S.dossiers, tasks: S.tasks, deadlines: S.deadlines, projects: S.projects, activity: S.activity }, null, 2)); }
function exportCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Référence","Dossier","Workflow","Étape","Véhicule","Secteur","Responsable","Montant","Priorité","Début","Échéance","Lien OneDrive","Archivé"]].concat(visDossiers().map(d => [d.code, d.name, wfById(d.workflowId)?.name, stageOf(d)?.name, d.vehicle, d.sector, mname(d.ownerId), can("view_amounts") ? d.amount : "", prioById(d.priority)?.label, d.startDate, d.dueDate, d.oneDriveUrl, d.archived ? "oui" : "non"]));
  saveFile(`inma-dossiers-${todayISO()}.csv`, "\ufeff" + rows.map(r => r.map(q).join(";")).join("\n"));
}
async function loadSamples() {
  const W = id => wfById(id); const inv = W("w_inv") || S.cfg.workflows[0], fin = W("w_fin") || S.cfg.workflows[0], ca = W("w_ca") || S.cfg.workflows[0], rep = W("w_rep") || S.cfg.workflows[0];
  const mid = i => S.cfg.members[i % S.cfg.members.length]?.id;
  const defs = [
    [inv, "Exemple — Clinique privée (santé)", 3, "Santé", 4500000, mid(2), [mid(3), mid(4)], -40, 50, "p2"],
    [inv, "Exemple — Groupe scolaire (éducation)", 1, "Éducation", 3000000, mid(3), [mid(5)], -12, 70, "p3"],
    [inv, "Exemple — Industriel agroalimentaire", 4, "Agroalimentaire", 6000000, mid(1), [mid(2), mid(3)], -75, 10, "p1"],
    [inv, "Exemple — Distributeur pharmaceutique", 7, "Distribution", 5000000, mid(2), [mid(4)], -400, 900, "p3"],
    [fin, "Exemple — Prêt participatif PME services", 1, "Services", 1500000, mid(3), [mid(5)], -9, 25, "p2"],
    [fin, "Exemple — Refinancement industriel", 2, "Industrie", 2500000, mid(2), [mid(3)], -20, 8, "p1"],
    [ca, "Exemple — CA trimestriel participation", 1, "Santé", "", mid(0), [mid(3)], -5, 12, "p2"],
    [rep, "Exemple — Reporting T3 portefeuille", 1, "Finance", "", mid(3), [mid(4), mid(5)], -10, 4, "p3"]
  ];
  for (const [w, name, si, sector, amount, owner, mem, st0, dd, pr] of defs) {
    const stg = w.stages[Math.min(si, w.stages.length - 1)];
    const d = { id: uid("d"), code: nextCode(w), name, workflowId: w.id, stageId: stg.id, vehicle: w.vehicle, ownerId: owner, members: [owner, ...mem], sector, priority: pr, amount: String(amount), startDate: addDays(todayISO(), st0), dueDate: addDays(todayISO(), dd), oneDriveUrl: "", tags: si >= 3 ? ["Prioritaire"] : [], custom: {}, docs: [], subfolders: [], history: [{ at: new Date().toISOString(), by: owner, from: null, to: stg.name }], stageSince: addDays(todayISO(), -Math.min(20, -st0)), createdAt: addDays(todayISO(), st0), sample: true, archived: false };
    if (si === 2 && w.id === "w_fin") d.pendingApproval = { to: w.stages[3].id, by: owner, at: new Date().toISOString() };
    await putDoc("dossiers", d);
    for (const [k, c] of (stg.checklist?.length ? stg.checklist : ["Point d'avancement"]).entries()) await putDoc("tasks", { id: uid("t"), title: c, description: "", dossierId: d.id, assignees: [k % 2 ? mem[0] || owner : owner], status: S.cfg.statuses[k === 0 ? 1 : 0].id, priority: pr, start: todayISO(), due: addDays(todayISO(), k * 4 - 2), recurring: "", dependsOn: [], checklist: [], docs: [], comments: [], custom: {}, tags: [], createdAt: new Date().toISOString(), createdBy: owner, sample: true });
  }
  await putDoc("tasks", { id: uid("t"), title: "Exemple — Reporting quotidien de trésorerie", description: "", dossierId: null, assignees: [mid(4)], status: S.cfg.statuses[0].id, priority: "p3", start: todayISO(), due: todayISO(), recurring: "daily", dependsOn: [], checklist: [{ text: "Soldes bancaires", done: false }, { text: "Mouvements du jour", done: false }], docs: [], comments: [], custom: {}, tags: [], createdAt: new Date().toISOString(), createdBy: mid(0), sample: true });
  await log("Données d'exemple chargées"); toast("Exemples chargés"); render();
}

/* ---------- render ---------- */
function render() {
  if (S.view !== "settings" && !navAllowed(S.view)) S.view = NAV.find(n => navAllowed(n[0]))?.[0] || "dossiers";
  applyBranding(); renderRail(); renderTop();
  const v = { meeting: vMeeting, projects: vProjects, deadlines: vDeadlines, funds: vFunds, dashboard: vDashboard, dossiers: vDossiers, tasks: vTasks, calendar: vCalendar, team: vTeam, onedrive: vOneDrive, settings: vSettings }[S.view] || vDashboard;
  $("#content").innerHTML = banners() + v();
}

/* ---------- boot ---------- */
function loadLocal() { const d = store.get(LOCAL_KEY, null); if (d) { S.cfg = { ...DEFAULT_CFG(), ...d.cfg }; S.dossiers = d.dossiers || []; S.tasks = d.tasks || []; S.deadlines = d.deadlines || []; S.projects = d.projects || []; S.activity = d.activity || []; } }
async function boot() {
  S.view = homeView(); render();
  const use = (window.INMA && window.INMA.use) || (window.claude && window.claude.use);
  let db = null, user = null, dl = null;
  if (use) { try { [db, user, dl] = await Promise.all([use("db"), use("user"), use("downloads")]); } catch {} }
  S.downloads = dl; S.user = user;
  if (user) { try { S.isOwner = await user.isOwner(); S.uid = await user.id(); } catch {} }
  if (!db) { S.mode = "local"; S.isOwner = true; loadLocal(); migrateCfg(store.get(LOCAL_KEY, null)?.cfg || { fresh: true }); S.view = homeView(); render(); return; }
  S.db = db; S.mode = "cloud";
  let first = true;
  db.doc("ws/config").onSnapshot(snap => {
    if (!snap.exists && !S._seeded) { S._seeded = true; db.doc("ws/config").set(clone(S.cfg)).catch(() => {}); }
    if (snap.exists) { const c = snap.data(); S.cfg = { ...DEFAULT_CFG(), ...c, general: { ...DEFAULT_CFG().general, ...(c.general || {}) }, onedrive: { ...DEFAULT_CFG().onedrive, ...(c.onedrive || {}) }, notify: { ...DEFAULT_CFG().notify, ...(c.notify || {}) } }; }
    if (first) { first = false; S.view = homeView(); }
    S.cfgLoaded = true; if (snap.exists) migrateCfg(snap.data()); if (!document.querySelector("#content :focus")) render(); renderDrawer();
  }, () => {});
  const sub = (coll, sortKey) => db.collection(coll).onSnapshot(q => { S[coll] = q.docs.map(d => ({ ...d.data(), id: d.id })); if (sortKey) S[coll].sort((a, b) => String(b[sortKey]).localeCompare(String(a[sortKey]))); if (!document.querySelector("#content :focus") && !$("#modal")) render(); if (S.openDossier && !document.querySelector("#layer :focus")) renderDrawer(); }, () => {});
  sub("dossiers", "createdAt"); sub("tasks", null); sub("claims", null); sub("deadlines", null); sub("projects", null);
  db.collection("activity").orderBy("at", "desc").limit(300).onSnapshot(q => { S.activity = q.docs.map(d => ({ ...d.data(), id: d.id })); if (!document.querySelector("#content :focus") && !$("#modal")) { renderTop(); if (S.view === "dashboard") render(); } }, () => {});
}
boot();
})();
</script>
