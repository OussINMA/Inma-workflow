<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INMA Workflow</title>
<meta name="theme-color" content="#212121">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" id="app-favicon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="/vendor/msal-browser.min.js"></script>
<script src="/inma-standalone.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy sidebar rail (brand) + working canvas; drawer for dossier detail; settings as tabbed console */
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --surface-2:#E9E9E9; --ink:#212121; --muted:#666A6E; --line:#DDDDDD;
  --brand:var(--brand-cfg,#212121); --accent:var(--accent-cfg,#E22529);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:var(--brand); --rail-ink:#E9E9E9; --rail-muted:#9A9FA5; --rail-active:rgba(255,255,255,.08);
  --ok:#2F8A5B; --warn:#B7791F; --bad:#B3191D; --info:#2F6FB0;
  --ok-bg:#E5F3EB; --warn-bg:#FBF0DD; --bad-bg:#FBE6E4; --info-bg:#E3EEF9;
  --shadow:0 1px 2px rgba(33,33,33,.06),0 6px 24px rgba(33,33,33,.10);
  --f-ui:var(--font-cfg,"Montserrat"),"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px; --pad:var(--density,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191C; --surface:#202326; --surface-2:#2A3139; --ink:#EDEDED; --muted:#A3A8AE; --line:#353C45;
  --brand:color-mix(in oklab,var(--brand-cfg,#212121) 85%,black); --accent:color-mix(in oklab,var(--accent-cfg,#E22529) 88%,white);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:color-mix(in oklab,var(--brand-cfg,#212121) 80%,black); --rail-ink:#E9E9E9; --rail-muted:#8E949B; --rail-active:rgba(255,255,255,.07);
  --ok:#5CC08B; --warn:#E3A84B; --bad:#FF6B6E; --info:#6FA8E4;
  --ok-bg:#16301F; --warn-bg:#33280F; --bad-bg:#3D1718; --info-bg:#14273A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191C; --surface:#202326; --surface-2:#2A3139; --ink:#EDEDED; --muted:#A3A8AE; --line:#353C45;
  --brand:color-mix(in oklab,var(--brand-cfg,#212121) 85%,black); --accent:color-mix(in oklab,var(--accent-cfg,#E22529) 88%,white);
  --primary:var(--accent); --on-primary:#FFFFFF;
  --rail:color-mix(in oklab,var(--brand-cfg,#212121) 80%,black); --rail-ink:#E9E9E9; --rail-muted:#8E949B; --rail-active:rgba(255,255,255,.07);
  --ok:#5CC08B; --warn:#E3A84B; --bad:#FF6B6E; --info:#6FA8E4;
  --ok-bg:#16301F; --warn-bg:#33280F; --bad-bg:#3D1718; --info-bg:#14273A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:18px;padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brandmark{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brandmark img{max-height:38px;max-width:170px;display:block}
.brand-logo{flex-direction:column;align-items:flex-start;gap:4px}
.brand-sub{font-size:9.5px;letter-spacing:.2em;font-weight:600;text-transform:uppercase;color:var(--accent-cfg,#E22529);white-space:nowrap}
.brand-default svg{height:30px;width:auto;display:block}
.app-icon-prev{width:44px;height:44px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--surface-2);flex:none}.app-icon-prev img,.app-icon-prev svg{width:40px;height:40px}
#present .pbar .brand-default svg{height:24px}
.logo-pill{background:#fff;border-radius:6px;padding:5px 8px;display:inline-block}
#present .pbar .brandmark img{max-height:28px}
.wordmark{font-weight:700;font-size:22px;letter-spacing:.18em;color:#fff}
.wordmark small{display:block;font-size:10px;letter-spacing:.22em;font-weight:500;color:var(--accent-cfg,#E22529);margin-top:1px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;border:0;background:none;color:var(--rail-ink);cursor:pointer;text-align:left;width:100%}
.nav:hover{background:var(--rail-active)}
.nav.on{background:var(--rail-active);box-shadow:inset 3px 0 0 var(--accent-cfg,#E22529);color:#fff;font-weight:600}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--rail-muted)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--rail-muted)}
.railfoot b{color:#fff;font-weight:600}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:700}
.crumb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.content{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in oklab,var(--warn) 40%,transparent)}
.banner.info{background:var(--info-bg);border-color:color-mix(in oklab,var(--info) 35%,transparent)}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:calc(7px*var(--pad)) 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:color-mix(in oklab,var(--ink) 30%,var(--line))}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=url],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:calc(7px*var(--pad)) 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f>span{letter-spacing:.02em}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:14px;font-weight:700}
.panel>header>svg{width:18px;height:18px;flex:none;color:var(--accent)}
.panel>.body{padding:14px 16px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;border:2px solid var(--surface)}
.avs{display:inline-flex}.avs .avatar+.avatar{margin-left:-7px}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.prio i{width:3px;height:12px;border-radius:2px;display:inline-block}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.dh{cursor:grab;color:var(--muted);font-size:14px;line-height:1;padding:2px 4px;border-radius:4px;user-select:none;flex:none;display:inline-flex;align-items:center}.dh:hover,.dh:focus-visible{color:var(--ink);background:var(--surface-2);outline:none}.dh:active{cursor:grabbing}
td>.dh{margin-right:4px;vertical-align:middle}.tkc{display:flex;align-items:center;gap:4px}
[data-si].s-dragging{opacity:.45}[data-si].s-before{box-shadow:inset 0 2px 0 var(--accent)}[data-si].s-after{box-shadow:inset 0 -2px 0 var(--accent)}
.odl{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;max-width:100%;background:var(--surface)}.odl>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}.odl:hover{border-color:var(--accent);color:var(--accent)}.odl svg{width:13px;height:13px;flex:none}
.step{cursor:pointer}.step.view .bar2{outline:2px solid var(--ink);outline-offset:1px}.step.view .nm{text-decoration:underline;font-weight:700}.ckd{width:18px;text-align:center;color:var(--muted);font-weight:700}.ckd.ok{color:var(--ok)}
.pgr{display:inline-block;width:64px;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;vertical-align:middle;flex:none}.pgr.wide{width:120px}.pgr>span{display:block;height:100%;background:var(--accent);border-radius:9px}.pgr-n{font-size:11.5px;color:var(--muted);margin-left:4px}
.hi-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#C2413A;background:var(--bad-bg);border-radius:99px;padding:1px 7px;white-space:nowrap}
.blk-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--bad);border-radius:4px;padding:1px 5px;vertical-align:middle}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in oklab,var(--bad) 40%,transparent)}.banner.ok{background:var(--ok-bg);border-color:color-mix(in oklab,var(--ok) 40%,transparent)}
.doc-t td{vertical-align:top}.doc-note{white-space:normal;color:#B7791F;font-size:12px;margin-top:2px}.chip.sm{font-size:10.5px;padding:1px 6px}th.c,td.c{text-align:center}
.pj-tasks{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.kpi-add{border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:row!important;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:13px;min-height:84px}.kpi-add:hover{color:var(--accent);border-color:var(--accent)}
.ck-preview{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}.ck-pv{display:inline-flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:12px}.ck-pv b{font-size:15px}
.dash{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{display:block;height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--brand);border-radius:3px}
:root[data-theme="dark"] .bar .fill{background:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar .fill{background:var(--accent)}}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tables */
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:calc(9px*var(--pad)) 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}
/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{width:auto;max-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border-radius:var(--r);display:flex;flex-direction:column;max-height:75vh}
.col>header{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.col>header .n{font-family:var(--f-mono);color:var(--muted);font-weight:500}
.col .cards{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:40px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:color-mix(in oklab,var(--accent) 50%,var(--line))}
.card .ref{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.card .ttl{font-weight:600;font-size:13px;line-height:1.3}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.lock{font-size:10.5px;color:var(--warn);font-weight:700;letter-spacing:.04em}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cal .d{background:var(--surface);min-height:96px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .d.out{background:var(--surface-2);opacity:.6}
.cal .d .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cal .d.today .n{color:var(--on-primary);background:var(--primary);border-radius:4px;padding:0 4px;align-self:flex-start}
.cal .ev{font-size:11px;padding:2px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:3px solid var(--accent);background:var(--surface-2)}
/* timeline */
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tl-inner{min-width:900px;position:relative}
.tl-head{display:grid;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tl-row{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line);min-height:38px;align-items:center}
.tl-row .nm{padding:6px 10px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line);cursor:pointer}
.tl-track{position:relative;height:38px}
.tl-bar{position:absolute;top:9px;height:20px;border-radius:4px;background:var(--brand);color:#fff;font-size:11px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.7}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(6,14,24,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer>header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:2}
.drawer .dbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modalwrap{position:fixed;inset:0;background:rgba(6,14,24,.5);z-index:60;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal>header h2{font-size:16px}
.modal .mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 110px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;cursor:pointer;padding-right:6px}
.step .bar2{height:5px;border-radius:3px;background:var(--line)}
.step.done .bar2{background:var(--ok)}
.step.cur .bar2{background:var(--accent)}
.step.cur{font-weight:700}
.step .nm{color:var(--muted)}
.step.cur .nm,.step.done .nm{color:var(--ink)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}

  return tb + slides.map((s, i) => `<section class="mt-slide" id="slide-${s.id}"><div class="mt-head"><span class="mt-num">${String(i + 1).padStart(2, "0")}</span><div><h2 style="font-size:18px">${s.color ? `<span class="fdot" style="--fc:${h(s.color)};margin-right:8px;width:12px;height:12px"></span>` : ""}${h(s.title)}</h2><div class="muted" style="font-size:12.5px">${h(s.sub || "")}</div></div></div>${s.html}</section>`).join("");
}
function presentMode(start) {
  S.present = { i: start || 0 }; drawPresent();
  try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
}
function drawPresent() {
  if (!S.present) { $("#present")?.remove(); return; }
  const slides = boardSlides({ since: addDays(todayISO(), -7), fund: "", ...(S.ui.mt || {}) }); if (!slides.length) { S.present = null; return; }
  S.present.i = Math.max(0, Math.min(slides.length - 1, S.present.i)); const s = slides[S.present.i];
  let el = $("#present"); if (!el) { el = document.createElement("div"); el.id = "present"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Présentation"); document.body.appendChild(el); }
  el.innerHTML = `<div class="pbar">${brandHTML("Réunion d'équipe")}<span class="spacer"></span><span class="muted num">${S.present.i + 1} / ${slides.length}</span><button class="btn sm" data-pv="-1" ${S.present.i === 0 ? "disabled" : ""} aria-label="Diapositive précédente">‹ Précédent</button><button class="btn sm" data-pv="1" ${S.present.i === slides.length - 1 ? "disabled" : ""} aria-label="Diapositive suivante">Suivant ›</button>${can("meetings") ? `<button class="btn sm" data-act5="mt-new">Rédiger le compte rendu</button>` : ""}<button class="btn sm" data-pv="x">Quitter</button></div>
    <div class="pbody"><div class="mt-head"><span class="mt-num">${String(S.present.i + 1).padStart(2, "0")}</span><div><h2 style="font-size:26px">${s.color ? `<span class="fdot" style="--fc:${h(s.color)};margin-right:10px;width:14px;height:14px"></span>` : ""}${h(s.title)}</h2><div class="muted">${h(s.sub || "")}</div></div></div>${s.html}</div>
    <div class="pdots">${slides.map((x, i) => `<button class="${i === S.present.i ? "on" : ""}" data-pv-go="${i}" aria-label="${h(x.title)}" title="${h(x.title)}"></button>`).join("")}</div>`;
}
function exitPresent() { S.present = null; $("#present")?.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }

/* ---------- meeting events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-pos],[data-pos-new],[data-prj],[data-act4],[data-pv],[data-pv-go]"); if (!el) return; const ds = el.dataset;
  if (ds.posNew) { posModal(ds.posNew); return; }
  if (ds.pos) { const [fid, pid] = ds.pos.split("|"); posModal(fid, pid); return; }
  if (ds.prj) { const p = (S.projects || []).find(x => x.id === ds.prj); if (p) prjModal(p); return; }
  if (ds.pv) { if (ds.pv === "x") exitPresent(); else { S.present.i += +ds.pv; drawPresent(); } return; }
  if (ds.pvGo) { S.present.i = +ds.pvGo; drawPresent(); return; }
  const A = ds.act4;
  if (A === "prj-new") prjModal(null);
  if (A === "prj-new-fund") prjModal(null, el.dataset.fid);
  if (A === "mt-present") presentMode(0);
  if (A === "mt-print") { try { window.print(); } catch { toast("Impression indisponible dans ce navigateur."); } }
  if (A === "prj-templates") {
    const have = new Set((S.projects || []).map(p => p.id)); const add = prjTemplates().filter(p => !have.has(p.id));
    if (!add.length) { toast("Les projets types sont déjà en place."); return; }
    confirmBox(`Créer ${add.length} projets types (outil de workflow management, démarche ESG, projets corporate des fonds) ? Vous pourrez les ajuster.`, "Créer", async () => { for (const p of add) await putDoc("projects", p); await log(`${add.length} projets types créés`); toast(`${add.length} projets créés`); render(); });
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pj-f-scope" || t.id === "pj-f-status") { S.ui.pj = { ...(S.ui.pj || {}), [t.id === "pj-f-scope" ? "scope" : "status"]: t.value }; saveUI(); render(); return; }
  if (t.id === "mt-since") { S.ui.mt = { ...(S.ui.mt || {}), since: t.value || addDays(todayISO(), -7) }; saveUI(); render(); return; }
  if (t.id === "mt-fund") { S.ui.mt = { ...(S.ui.mt || {}), fund: t.value }; saveUI(); render(); return; }
  if (t.dataset.mtSec) { const mt = S.ui.mt || {}; mt.sections = { ...(mt.sections || {}), [t.dataset.mtSec]: t.checked ? 1 : 0 }; S.ui.mt = mt; saveUI(); render(); }
});
document.addEventListener("keydown", e => {
  if (S.present && !$("#modal") && !(S.openDossier) && !e.target.closest?.("input,textarea,select")) {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); S.present.i++; drawPresent(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); S.present.i--; drawPresent(); }
    else if (e.key === "Escape") exitPresent();
  } else if (e.key === "Enter" && e.target.matches?.(".prj[data-prj]")) e.target.click();
});
function fundProjectsPanel(f) {
  const l = visProjects().filter(p => p.scope === f.id);
  return `<div class="panel"><header><h2>Projets corporate · ${h(f.name)}</h2><span class="muted" style="font-size:12px">${l.filter(p => p.status !== "done").length} en cours</span><span class="spacer"></span>${can("projects") ? `<button class="btn sm" data-act4="prj-new-fund" data-fid="${f.id}">${ic("plus")}Nouveau projet</button>` : ""}</header><div class="body ${l.length ? "prj-grid" : ""}">${l.map(prjCard).join("") || '<p class="muted" style="margin:0">Aucun projet corporate pour ce fonds (levée, gouvernance, reporting, agrément…).</p>'}</div></div>`;
}

/* ---------- journal des réunions (comptes rendus) ---------- */
const MT_VIS = [["all", "Toute l'équipe interne"], ["roles", "Certains rôles + participants"], ["participants", "Participants uniquement"]];
const internals = () => S.cfg.members.filter(m => !m.external);
function canSeeMeeting(m) {
  if (!m) return false; if (!S.sim && S.isOwner) return true;
  const u = me(); if (!u || isExt(u)) return false;
  if (m.createdBy === u.id || m.secretaryId === u.id || (m.participants || []).includes(u.id)) return true;
  if (!m.visibility || m.visibility === "all") return true;
  if (m.visibility === "roles") return (m.roles || []).includes(u.roleId);
  return false;
}
const canEditMeeting = m => canSeeMeeting(m) && (can("meetings") || (!!me() && (m.createdBy === me().id || m.secretaryId === me().id)));
const visMeetings = () => (S.meetings || []).filter(canSeeMeeting).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
const mtType = id => (S.cfg.meetingTypes || []).find(t => t.id === id) || { id: "", label: "Réunion", color: "#7B8794" };
const nid = p => uid(p);
function meetingSnapshot() {
  const ds = visDossiers().filter(d => !d.archived);
  return { at: new Date().toISOString(), dossiers: ds.map(d => { const w = wfById(d.workflowId), s = stageOf(d); return { id: d.id, code: d.code, name: d.name, vehicle: d.vehicle || "", stage: s?.name || "", idx: w ? w.stages.indexOf(s) : -1, n: w?.stages.length || 0, ownerId: d.ownerId, pending: !!d.pendingApproval }; }),
    kpis: { dossiers: ds.length, lateTasks: visTasks().filter(t => !isDone(t) && t.due && t.due < todayISO()).length, openTasks: visTasks().filter(t => !isDone(t)).length, pending: ds.filter(d => d.pendingApproval).length, projects: visProjects().filter(p => p.status !== "done").length } };
}
function newMeeting() {
  const fund = S.ui.mt?.fund || "";
  const t = (S.cfg.meetingTypes || [])[0]?.id || "";
  return { id: nid("mt"), title: `${mtType(t).label} du ${fdate(todayISO())}`, date: todayISO(), time: "", type: t, scope: fund || "inma", location: "", participants: internals().map(m => m.id), absents: [], secretaryId: me()?.id || "", visibility: "all", roles: [], status: "draft", notes: "", points: [], decisions: [], actions: [], deadlines: [], url: "", snapshot: meetingSnapshot(), createdBy: me()?.id || null, createdAt: new Date().toISOString() };
}
function openMeetingEditor(m) { S.mtDraft = clone(m); S.view = "meeting"; S.ui.mtTab = "edit"; saveUI(); render(); window.scrollTo?.(0, 0); }
const liveTask = id => S.tasks.find(t => t.id === id);
function taskStateChip(a) {

    if (/^\s*[-*•]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) it.push(lines[i++].replace(/^\s*[-*•]\s+/, "")); out.push(`<ul>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ul>`); continue; }
    if (/^\s*\d+[.)]\s+/.test(l)) { const it = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) it.push(lines[i++].replace(/^\s*\d+[.)]\s+/, "")); out.push(`<ol>${it.map(x => `<li>${inl(x)}</li>`).join("")}</ol>`); continue; }
    if (!l.trim()) { i++; continue; }

/* ---------- agenda : réunions planifiées, calendrier type Outlook, liaison Outlook ---------- */

}
const agType = e => mtType(e.type);

// Occurrences d'une réunion entre deux dates (incluses)
function agOcc(e, from, to) {

    for (const [k, c] of (stg.checklist?.length ? stg.checklist : ["Point d'avancement"]).entries()) await putDoc("tasks", { id: uid("t"), title: c, description: "", dossierId: d.id, assignees: [k % 2 ? mem[0] || owner : owner], status: S.cfg.statuses[k === 0 ? 1 : 0].id, priority: pr, start: todayISO(), due: addDays(todayISO(), k * 4 - 2), recurring: "", dependsOn: [], checklist: [], docs: [], comments: [], custom: {}, tags: [], createdAt: new Date().toISOString(), createdBy: owner, sample: true });
  }
  await putDoc("tasks", { id: uid("t"), title: "Exemple — Reporting quotidien de trésorerie", description: "", dossierId: null, assignees: [mid(4)], status: S.cfg.statuses[0].id, priority: "p3", start: todayISO(), due: todayISO(), recurring: "daily", dependsOn: [], checklist: [{ text: "Soldes bancaires", done: false }, { text: "Mouvements du jour", done: false }], docs: [], comments: [], custom: {}, tags: [], createdAt: new Date().toISOString(), createdBy: mid(0), sample: true });
  await log("Données d'exemple chargées"); toast("Exemples chargés"); render();
}

/* ---------- render ---------- */
function render() {
  if (S.view !== "settings" && !navAllowed(S.view)) S.view = NAV.find(n => navAllowed(n[0]))?.[0] || "dossiers";
  applyBranding(); renderRail(); renderTop();
  const v = { guide: vGuide, compliance: vCompliance, meeting: vMeeting, projects: vProjects, deadlines: vDeadlines, funds: vFunds, dashboard: vDashboard, dossiers: vDossiers, tasks: vTasks, calendar: vCalendar, team: vTeam, onedrive: vOneDrive, settings: vSettings }[S.view] || vDashboard;
  $("#content").innerHTML = banners() + v();
  if (S.ai?.open && !document.querySelector("#aipanel :focus") && !S.ai.busy) renderAI();
}

/* ---------- boot ---------- */
function loadLocal() { const d = store.get(LOCAL_KEY, null); if (d) { S.cfg = { ...DEFAULT_CFG(), ...d.cfg }; S.dossiers = d.dossiers || []; S.tasks = d.tasks || []; S.deadlines = d.deadlines || []; S.projects = d.projects || []; S.meetings = d.meetings || []; S.events = d.events || []; S.prefs = d.prefs || []; S.activity = d.activity || []; } }
async function boot() {
  S.view = homeView(); render();
  const use = (window.INMA && window.INMA.use) || (window.claude && window.claude.use);
  let db = null, user = null, dl = null;
  if (use) { try { [db, user, dl] = await Promise.all([use("db"), use("user"), use("downloads")]); } catch {} }
  S.downloads = dl; S.user = user;
  if (user) { try { S.isOwner = await user.isOwner(); S.uid = await user.id(); } catch {} }
  if (!db) { S.mode = "local"; S.isOwner = true; loadLocal(); migrateCfg(store.get(LOCAL_KEY, null)?.cfg || { fresh: true }); S.view = homeView(); render(); return; }
  S.db = db; S.mode = "cloud";
  let first = true;
  db.doc("ws/config").onSnapshot(snap => {
    if (!snap.exists && !S._seeded) { S._seeded = true; db.doc("ws/config").set(clone(S.cfg)).catch(() => {}); }
    if (snap.exists) { const c = snap.data(); S.cfg = { ...DEFAULT_CFG(), ...c, general: { ...DEFAULT_CFG().general, ...(c.general || {}) }, onedrive: { ...DEFAULT_CFG().onedrive, ...(c.onedrive || {}) }, notify: { ...DEFAULT_CFG().notify, ...(c.notify || {}) } }; }
    if (first) { first = false; S.view = homeView(); }
    S.cfgLoaded = true; if (snap.exists) migrateCfg(snap.data()); if (!document.querySelector("#content :focus")) render(); renderDrawer();
  }, () => {});
  const sub = (coll, sortKey) => db.collection(coll).onSnapshot(q => { S[coll] = q.docs.map(d => ({ ...d.data(), id: d.id })); if (sortKey) S[coll].sort((a, b) => String(b[sortKey]).localeCompare(String(a[sortKey]))); if (!document.querySelector("#content :focus") && !$("#modal")) render(); if (S.openDossier && !document.querySelector("#layer :focus")) renderDrawer(); }, () => {});
  sub("dossiers", "createdAt"); sub("tasks", null); sub("claims", null); sub("deadlines", null); sub("projects", null); sub("meetings", null); sub("events", null); sub("prefs", null);
  db.collection("activity").orderBy("at", "desc").limit(300).onSnapshot(q => { S.activity = q.docs.map(d => ({ ...d.data(), id: d.id })); if (!document.querySelector("#content :focus") && !$("#modal")) { renderTop(); if (S.view === "dashboard") render(); } }, () => {});
}
boot();
})();
</script>
